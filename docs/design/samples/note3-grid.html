<!doctype html>
<html lang="ja" class="scroll-smooth">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReNovel — note風カードグリッド（表紙なし・テキストカード）</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans:['"Noto Sans JP"','sans-serif'], mincho:['"Shippori Mincho"','serif'] },
    colors: { note:{ DEFAULT:'#2cb696', 600:'#25a487', 700:'#1f8d74' }, ink:'#292929', sub:'#767676', line:'#ececec' },
    borderRadius: { DEFAULT:'6px', md:'6px', lg:'8px' }
  } }
}
</script>
</head>
<body class="bg-neutral-50 text-ink font-sans antialiased">

<!-- ===== Header ===== -->
<header class="sticky top-0 z-20 bg-white border-b border-line">
  <div class="mx-auto max-w-6xl px-4 h-14 flex items-center gap-3">
    <a href="#" class="text-xl font-black tracking-tight shrink-0">ReNovel<span class="text-note"> tales</span></a>
    <div class="flex-1 max-w-sm hidden sm:block">
      <div class="relative">
        <input placeholder="作品・作者・タグを検索" class="w-full bg-neutral-100 rounded-full text-sm pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-note/40">
        <svg class="w-4 h-4 absolute left-3.5 top-2.5 text-sub" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      </div>
    </div>
    <div class="flex items-center gap-2 ml-auto">
      <button class="w-9 h-9 rounded-full hover:bg-neutral-100 flex items-center justify-center text-sub" title="通知">🔔</button>
      <a href="#" class="text-sm font-bold px-4 py-2 rounded-full bg-note text-white hover:bg-note-600">投稿する</a>
      <span class="w-9 h-9 rounded-full bg-gradient-to-br from-note to-emerald-400 text-white text-xs flex items-center justify-center font-bold">你</span>
    </div>
  </div>
  <div class="mx-auto max-w-6xl px-4">
    <nav class="flex gap-6 text-sm overflow-x-auto">
      <a href="#" class="py-3 border-b-2 border-ink font-bold whitespace-nowrap">ランキング</a>
      <a href="#" class="py-3 border-b-2 border-transparent text-sub hover:text-ink whitespace-nowrap">新着</a>
      <a href="#" class="py-3 border-b-2 border-transparent text-sub hover:text-ink whitespace-nowrap">ジャンル</a>
      <a href="#" class="py-3 border-b-2 border-transparent text-sub hover:text-ink whitespace-nowrap">コンテスト</a>
      <a href="#" class="py-3 border-b-2 border-transparent text-sub hover:text-ink whitespace-nowrap">フォロー中</a>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-6 space-y-10">

  <!-- ===== 週間ランキング（テキストカードのグリッド）===== -->
  <section>
    <div class="flex items-end justify-between mb-4">
      <h2 class="text-lg font-bold">週間ランキング</h2>
      <a href="#" class="text-sm text-note-700 font-bold hover:underline">すべて見る →</a>
    </div>
    <div id="rank" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

  <!-- ===== 新着作品（テキストカードのグリッド）===== -->
  <section>
    <div class="flex items-end justify-between mb-4">
      <h2 class="text-lg font-bold">新着作品</h2>
      <a href="#" class="text-sm text-note-700 font-bold hover:underline">もっと見る →</a>
    </div>
    <div id="new" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>
</main>

<footer class="border-t border-line bg-white">
  <div class="mx-auto max-w-6xl px-4 py-8 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-sub">
    <span class="font-black text-ink">ReNovel</span>
    <a href="#" class="hover:text-ink">ランキング</a><a href="#" class="hover:text-ink">新着</a><a href="#" class="hover:text-ink">タグ</a>
    <a href="#" class="hover:text-ink">執筆</a><a href="#" class="hover:text-ink">ヘルプ</a><a href="#" class="hover:text-ink">利用規約</a>
  </div>
</footer>

<script>
// 表紙画像は持たない。タイトル・キャッチコピー・本文を主役にしたテキストカード。
const data=[
  {t:'神は勇者を選ばない',cp:'選ばれなかった少年の、静かな下剋上。',a:'三日月 灯',ini:'三',g:'異世界FT',tags:['#群像劇','#下剋上'],n:'32話',like:'1.2万',s:'連載中'},
  {t:'星の降る夜、君と',cp:'余命一年の彼女と、天文部の最後の夏。',a:'白瀬 みなと',ini:'白',g:'恋愛',tags:['#青春','#切ない'],n:'18話',like:'9,812',s:'連載中'},
  {t:'六番目の遺言',cp:'遺言はすべて嘘だった。書いたのは死者自身。',a:'灰田 透',ini:'灰',g:'ミステリー',tags:['#どんでん返し'],n:'24話',like:'7,109',s:'完結'},
  {t:'機械仕掛けの神様',cp:'祈ることを覚えた、最後のAIの物語。',a:'藤堂 詩織',ini:'藤',g:'SF',tags:['#AI','#静謐'],n:'24話',like:'5,442',s:'連載中'},
  {t:'彼女は毒を綴る',cp:'言葉に毒を込める少女と、代筆屋の記録。',a:'七尾 凛',ini:'七',g:'ローFT',tags:['#書簡体','#ダーク'],n:'58話',like:'4,003',s:'完結'},
  {t:'最果ての図書館',cp:'世界の終わりで、司書だけが本を守っている。',a:'青柳 water',ini:'青',g:'文芸',tags:['#静謐'],n:'11話',like:'3,120',s:'連載中'},
];
const newer=[
  {t:'塔の上の錬金術師',cp:'塔から降りられない錬金術師と、届け物の鳥。',a:'硝子 ましろ',ini:'硝',g:'異世界FT',tags:['#ほのぼの'],n:'1話',like:'82',s:'連載中'},
  {t:'きみの余白',cp:'ノートの余白で交わす、名も知らぬ誰かとの文通。',a:'白詰 くさ',ini:'白',g:'恋愛',tags:['#文通','#青春'],n:'4話',like:'140',s:'連載中'},
  {t:'3時14分の空',cp:'1日が3時14分で巻き戻る世界で、彼だけが気づく。',a:'円周 律',ini:'円',g:'SF',tags:['#ループ'],n:'2話',like:'96',s:'連載中'},
  {t:'火曜日の喫茶店',cp:'毎週火曜だけ現れる、閉店間際の客の話。',a:'遠野 珈琲',ini:'遠',g:'現代',tags:['#日常'],n:'3話',like:'1,540',s:'連載中'},
  {t:'雨夜の密室',cp:'鍵は内側。窓は塞がれ、証人は雨だけ。',a:'梶 真冬',ini:'梶',g:'ミステリー',tags:['#本格'],n:'7話',like:'330',s:'連載中'},
  {t:'海辺の食卓',cp:'祖母の家で始まる、ひと夏の再生の物語。',a:'小春 日和',ini:'小',g:'文芸',tags:['#家族'],n:'8話',like:'180',s:'連載中'},
];
function card(x,rank){
  const status = x.s==='連載中'
    ? '<span class="text-[11px] font-bold text-note-700 bg-note/10 rounded px-1.5 py-0.5">連載中</span>'
    : '<span class="text-[11px] font-bold text-sub bg-neutral-100 rounded px-1.5 py-0.5">完結</span>';
  const rankChip = rank!=null
    ? `<span class="w-6 h-6 flex items-center justify-center text-xs font-black text-white rounded ${rank<3?'bg-note':'bg-neutral-400'}">${rank+1}</span>`
    : '';
  return `<article class="bg-white rounded-md border border-line shadow-sm hover:shadow-md hover:border-note/40 transition p-4 flex flex-col">
    <div class="flex items-center gap-2 mb-2">
      ${rankChip}${status}
      <span class="text-[11px] text-sub ml-auto px-1.5 py-0.5 rounded-full bg-neutral-100">${x.g}</span>
    </div>
    <h3 class="font-mincho font-bold text-lg leading-snug line-clamp-2 hover:text-note-700"><a href="#">${x.t}</a></h3>
    <p class="text-[13px] text-note-700 mt-1.5 leading-snug line-clamp-2">${x.cp}</p>
    <div class="flex flex-wrap gap-1.5 mt-2 flex-1">
      ${x.tags.map(t=>`<a href="#" class="text-[11px] text-sub hover:text-note-700">${t}</a>`).join('')}
    </div>
    <div class="mt-3 pt-3 border-t border-line flex items-center gap-2">
      <span class="w-6 h-6 rounded-full bg-neutral-200 text-[10px] flex items-center justify-center font-bold text-sub shrink-0">${x.ini}</span>
      <a href="#" class="text-xs text-sub truncate hover:underline">${x.a}</a>
      <span class="ml-auto text-xs text-sub shrink-0">${x.n} ・ ♡ ${x.like}</span>
    </div>
  </article>`;
}
document.getElementById('rank').innerHTML = data.map((x,i)=>card(x,i)).join('');
document.getElementById('new').innerHTML = newer.map((x)=>card(x,null)).join('');
</script>
</body>
</html>
